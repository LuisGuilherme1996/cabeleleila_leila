<div class="bg-[var(--color-surface-dark-elevated)] border border-[var(--color-hairline-dark)]
            rounded-[var(--radius-md)] p-5">
  <h2 class="label-md text-[var(--color-on-dark)] mb-5">Novo Bloqueio</h2>

  <form (ngSubmit)="onSubmit()" #f="ngForm" class="flex flex-col gap-4">
    <div>
      <label for="motivo" class="block caption-sm text-[var(--color-mute-dark)] mb-1">
        Motivo <span class="text-red-500">*</span>
      </label>
      <input
        id="motivo"
        type="text"
        [(ngModel)]="form.motivo"
        name="motivo"
        required
        placeholder="Ex: Feriado, férias..."
        class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)]
               rounded-lg text-[var(--color-on-dark)] text-sm outline-none
               focus:border-[var(--color-primary)] transition-colors"
      />
    </div>

    <div>
      <label for="dataInicio" class="block caption-sm text-[var(--color-mute-dark)] mb-1">
        Data/Hora Início <span class="text-red-500">*</span>
      </label>
      <input
        id="dataInicio"
        type="datetime-local"
        [(ngModel)]="form.dataInicio"
        name="dataInicio"
        required
        class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)]
               rounded-lg text-[var(--color-on-dark)] text-sm outline-none
               focus:border-[var(--color-primary)] transition-colors"
      />
    </div>

    <div>
      <label for="dataFim" class="block caption-sm text-[var(--color-mute-dark)] mb-1">
        Data/Hora Fim <span class="text-red-500">*</span>
      </label>
      <input
        id="dataFim"
        type="datetime-local"
        [(ngModel)]="form.dataFim"
        name="dataFim"
        required
        class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)]
               rounded-lg text-[var(--color-on-dark)] text-sm outline-none
               focus:border-[var(--color-primary)] transition-colors"
      />
    </div>

    <ui-button type="submit" variant="primary" [disabled]="saving() || !!f.invalid">
      {{ saving() ? 'Criando...' : 'Criar Bloqueio' }}
    </ui-button>
  </form>
</div>
