<section class="py-[var(--space-section)] px-6">
  <div class="max-w-3xl mx-auto">
    <div class="mb-8">
      <h1 class="display-md text-[var(--color-on-dark)] mb-1">Horários de Funcionamento</h1>
      <p class="body-md text-[var(--color-body-dark)]">
        Configure os horários de atendimento para cada dia da semana.
      </p>
    </div>

    @if (error$ | async; as err) {
      <p class="body-md text-red-500 mb-4">{{ err }}</p>
    }

    <app-horarios-grade
      [horarios]="horarios$ | async"
      [loading]="(loading$ | async) ?? false"
      [saving]="(saving$ | async) ?? false"
      (salvar)="onSalvarHorario($event)"
    />
  </div>
</section>
