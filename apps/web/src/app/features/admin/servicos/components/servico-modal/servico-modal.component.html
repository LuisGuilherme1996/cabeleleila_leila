<ui-dialog [isOpen]="isOpen()" [title]="modalTitle" (close)="onClose()">
  <form (ngSubmit)="onSubmit()" #f="ngForm">
    <div class="flex flex-col gap-4">
      <div>
        <label for="nome" class="block text-xs font-semibold text-[var(--color-on-dark-mute)] uppercase tracking-wide mb-1">
          Nome <span class="text-red-500">*</span>
        </label>
        <input
          id="nome"
          type="text"
          [(ngModel)]="form.nome"
          name="nome"
          required
          minlength="2"
          placeholder="Ex: Corte feminino"
          class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)] rounded-lg text-[var(--color-on-dark)]
                 text-sm placeholder:text-[var(--color-mute-dark)]/50 focus:bg-[var(--color-surface-dark-card)] focus:border-[var(--color-primary)] focus:ring-4 focus:ring-[var(--color-primary)]/10
                 transition-all outline-none"
        />
      </div>

      <div>
        <label for="descricao" class="block text-xs font-semibold text-[var(--color-on-dark-mute)] uppercase tracking-wide mb-1">
          Descrição
        </label>
        <textarea
          id="descricao"
          [(ngModel)]="form.descricao"
          name="descricao"
          rows="3"
          placeholder="Descrição opcional do serviço..."
          class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)] rounded-lg text-[var(--color-on-dark)]
                 text-sm placeholder:text-[var(--color-mute-dark)]/50 focus:bg-[var(--color-surface-dark-card)] focus:border-[var(--color-primary)] focus:ring-4 focus:ring-[var(--color-primary)]/10
                 transition-all outline-none resize-none"
        ></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="preco" class="block text-xs font-semibold text-[var(--color-on-dark-mute)] uppercase tracking-wide mb-1">
            Preço (R$) <span class="text-red-500">*</span>
          </label>
          <input
            id="preco"
            type="number"
            [(ngModel)]="form.preco"
            name="preco"
            required
            min="0"
            step="0.01"
            placeholder="0,00"
            class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)] rounded-lg text-[var(--color-on-dark)]
                   text-sm placeholder:text-[var(--color-mute-dark)]/50 focus:bg-[var(--color-surface-dark-card)] focus:border-[var(--color-primary)] focus:ring-4 focus:ring-[var(--color-primary)]/10
                   transition-all outline-none"
          />
        </div>

        <div>
          <label for="duracao" class="block text-xs font-semibold text-[var(--color-on-dark-mute)] uppercase tracking-wide mb-1">
            Duração (min) <span class="text-red-500">*</span>
          </label>
          <input
            id="duracao"
            type="number"
            [(ngModel)]="form.duracaoMinutos"
            name="duracaoMinutos"
            required
            min="1"
            step="1"
            placeholder="30"
            class="w-full px-4 py-2.5 bg-[var(--color-surface-dark-card)] border border-[var(--color-hairline-dark)] rounded-lg text-[var(--color-on-dark)]
                   text-sm placeholder:text-[var(--color-mute-dark)]/50 focus:bg-[var(--color-surface-dark-card)] focus:border-[var(--color-primary)] focus:ring-4 focus:ring-[var(--color-primary)]/10
                   transition-all outline-none"
          />
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <ui-button type="button" variant="secondary" (click)="onClose()">
          Cancelar
        </ui-button>
        <ui-button type="submit" variant="primary" [disabled]="saving() || !!f.invalid">
          {{ saving() ? 'Salvando...' : 'Salvar' }}
        </ui-button>
      </div>
    </div>
  </form>
</ui-dialog>
