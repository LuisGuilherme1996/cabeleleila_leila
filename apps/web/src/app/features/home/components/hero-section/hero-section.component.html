<section class="py-[var(--space-section)] px-6">
  <div class="max-w-7xl mx-auto">
    <p class="caption-sm text-[var(--color-mute-dark)] uppercase tracking-wider mb-4">
      Brilho &amp; Elegância ao seu Alcance
    </p>
    <h1 class="display-xl text-[var(--color-on-dark)] max-w-2xl mb-6">
      Sua beleza merece o cuidado da
      <span class="text-[var(--color-primary)]">Leila</span>
    </h1>
    <p class="body-md text-[var(--color-body-dark)] max-w-xl mb-10">
      Agende online com total autonomia. Escolha o serviço, selecione o dia e o
      melhor horário em poucos segundos.
    </p>
    <a
      [routerLink]="ctaRoute()"
      class="inline-flex items-center gap-2 px-8 py-4 rounded-[var(--radius-full)]
             bg-[var(--color-primary)] text-[var(--color-on-dark)] btn-label-lg
             hover:bg-[var(--color-primary-pressed)] transition-colors shadow-active"
    >
      Fazer Agendamento
    </a>
  </div>
</section>
