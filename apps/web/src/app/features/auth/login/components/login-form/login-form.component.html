<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
  <!-- E-mail -->
  <div class="flex flex-col gap-1">
    <label for="email" class="caption-md text-[var(--color-body-dark)]">E-mail</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      class="w-full px-4 py-3 rounded-[var(--radius-sm)]
             bg-[var(--color-canvas-dark)] border border-[var(--color-hairline-dark)]
             text-[var(--color-on-dark)] body-sm
             focus:outline-none focus:border-[var(--color-primary)]"
      placeholder="seu@email.com"
    />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <span class="caption-sm text-[var(--color-warning)]">Informe um e-mail válido.</span>
    }
  </div>

  <!-- Senha com olho mágico -->
  <div class="flex flex-col gap-1">
    <div class="flex items-center justify-between">
      <label for="senha" class="caption-md text-[var(--color-body-dark)]">Senha</label>
      <a routerLink="/esqueci-senha" class="caption-sm text-[var(--color-primary)] hover:underline">
        Esqueci a senha
      </a>
    </div>
    <div class="relative">
      <input
        id="senha"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="senha"
        autocomplete="current-password"
        class="w-full px-4 py-3 pr-12 rounded-[var(--radius-sm)]
               bg-[var(--color-canvas-dark)] border border-[var(--color-hairline-dark)]
               text-[var(--color-on-dark)] body-sm
               focus:outline-none focus:border-[var(--color-primary)]"
        placeholder="••••••••"
      />
      <button
        type="button"
        (click)="togglePassword()"
        aria-label="Alternar visibilidade da senha"
        class="absolute inset-y-0 right-3 flex items-center text-[var(--color-mute-dark)]
               hover:text-[var(--color-on-dark)] transition-colors"
      >
        @if (showPassword()) {
          <!-- olho aberto -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        } @else {
          <!-- olho fechado -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        }
      </button>
    </div>
    @if (form.get('senha')?.invalid && form.get('senha')?.touched) {
      <span class="caption-sm text-[var(--color-warning)]">Senha obrigatória.</span>
    }
  </div>

  <!-- Erro global -->
  @if (error()) {
    <p role="alert" class="caption-md text-[var(--color-warning)] bg-red-950/30 border border-red-800/40 rounded-[var(--radius-sm)] px-3 py-2">
      {{ error() }}
    </p>
  }

  <!-- CTA principal -->
  <button
    type="submit"
    [disabled]="loading() || form.invalid"
    class="w-full py-3 rounded-[var(--radius-full)]
           bg-[var(--color-primary)] text-[var(--color-on-dark)] btn-label-md
           hover:bg-[var(--color-primary-pressed)] transition-colors
           disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ loading() ? 'Entrando...' : 'Entrar' }}
  </button>

  <!-- Divisor -->
  <div class="flex items-center gap-3 my-1">
    <span class="flex-1 h-px bg-[var(--color-hairline-dark)]"></span>
    <span class="caption-sm text-[var(--color-mute-dark)]">ou</span>
    <span class="flex-1 h-px bg-[var(--color-hairline-dark)]"></span>
  </div>

  <!-- Login via Google -->
  <a
    [href]="googleAuthUrl"
    class="flex items-center justify-center gap-3 w-full py-3 rounded-[var(--radius-full)]
           border border-[var(--color-hairline-dark)] text-[var(--color-on-dark)] body-sm
           hover:bg-[var(--color-surface-dark-elevated)] transition-colors"
  >
    <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar com Google
  </a>
</form>
