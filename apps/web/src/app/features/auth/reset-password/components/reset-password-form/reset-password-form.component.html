<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

  <!-- Nova senha -->
  <div class="flex flex-col gap-1">
    <label for="novaSenha" class="caption-md text-[var(--color-body-dark)]">Nova senha</label>
    <div class="relative">
      <input
        id="novaSenha"
        [type]="showNova() ? 'text' : 'password'"
        formControlName="novaSenha"
        autocomplete="new-password"
        class="w-full px-4 py-3 pr-12 rounded-[var(--radius-sm)]
               bg-[var(--color-canvas-dark)] border border-[var(--color-hairline-dark)]
               text-[var(--color-on-dark)] body-sm
               focus:outline-none focus:border-[var(--color-primary)]"
        placeholder="Mínimo 8 caracteres"
      />
      <button type="button" (click)="showNova.update(v => !v)"
        aria-label="Alternar visibilidade"
        class="absolute inset-y-0 right-3 flex items-center text-[var(--color-mute-dark)] hover:text-[var(--color-on-dark)] transition-colors">
        @if (showNova()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        }
      </button>
    </div>
    @if (form.get('novaSenha')?.invalid && form.get('novaSenha')?.touched) {
      <span class="caption-sm text-[var(--color-warning)]">Senha deve ter pelo menos 8 caracteres.</span>
    }
  </div>

  <!-- Confirmar senha -->
  <div class="flex flex-col gap-1">
    <label for="confirmarSenha" class="caption-md text-[var(--color-body-dark)]">Confirmar nova senha</label>
    <div class="relative">
      <input
        id="confirmarSenha"
        [type]="showConfirmar() ? 'text' : 'password'"
        formControlName="confirmarSenha"
        autocomplete="new-password"
        class="w-full px-4 py-3 pr-12 rounded-[var(--radius-sm)]
               bg-[var(--color-canvas-dark)] border border-[var(--color-hairline-dark)]
               text-[var(--color-on-dark)] body-sm
               focus:outline-none focus:border-[var(--color-primary)]"
        [class.border-red-600]="form.errors?.['senhasDiferentes'] && form.get('confirmarSenha')?.touched"
        placeholder="Repita a nova senha"
      />
      <button type="button" (click)="showConfirmar.update(v => !v)"
        aria-label="Alternar visibilidade"
        class="absolute inset-y-0 right-3 flex items-center text-[var(--color-mute-dark)] hover:text-[var(--color-on-dark)] transition-colors">
        @if (showConfirmar()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        }
      </button>
    </div>
    @if (form.errors?.['senhasDiferentes'] && form.get('confirmarSenha')?.touched) {
      <span class="caption-sm text-[var(--color-warning)]">As senhas não coincidem.</span>
    }
  </div>

  @if (error()) {
    <p role="alert" class="caption-md text-[var(--color-warning)] bg-red-950/30 border border-red-800/40 rounded-[var(--radius-sm)] px-3 py-2">
      {{ error() }}
    </p>
  }

  <button
    type="submit"
    [disabled]="loading()"
    class="w-full py-3 rounded-[var(--radius-full)]
           bg-[var(--color-primary)] text-[var(--color-on-dark)] btn-label-md
           hover:bg-[var(--color-primary-pressed)] transition-colors
           disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ loading() ? 'Salvando...' : 'Redefinir senha' }}
  </button>
</form>
