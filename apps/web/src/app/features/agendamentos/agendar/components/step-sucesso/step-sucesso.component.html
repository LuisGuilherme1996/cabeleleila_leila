<div class="flex flex-col items-center text-center gap-6 py-10">
  <!-- Animated checkmark -->
  <div
    class="w-20 h-20 rounded-full bg-[var(--color-primary)]/20 flex items-center justify-center
           animate-[ping_0.4s_ease-out_forwards]"
  >
    <div class="w-14 h-14 rounded-full bg-[var(--color-primary)] flex items-center justify-center">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
    </div>
  </div>

  <div>
    <h2 class="display-md text-[var(--color-on-dark)] mb-2">Agendamento Confirmado!</h2>
    <p class="body-md text-[var(--color-body-dark)]">
      Seu horário foi reservado com sucesso.
    </p>
  </div>

  <p class="caption-md text-[var(--color-mute-dark)]">
    Redirecionando para seus agendamentos em {{ countdown }}s...
  </p>

  <button
    type="button"
    (click)="novoAgendamento.emit()"
    class="px-8 py-3 rounded-[var(--radius-full)]
           bg-[var(--color-primary)] text-[var(--color-on-dark)] btn-label-md
           hover:bg-[var(--color-primary-pressed)] transition-colors"
  >
    Ver Meus Agendamentos
  </button>
</div>
